commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-commit:
  commands:
    prettier:
      glob: '*.{ts,vue,mjs,json,yml,yaml,css,md}'
      run: pnpm exec prettier --check {staged_files}
    eslint:
      glob: '*.{ts,vue,mjs}'
      run: pnpm exec eslint {staged_files}
